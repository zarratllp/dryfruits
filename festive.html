<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Festive Collection</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    background: #fff8f0;
}

/* Section Styling */
.festive-section {
    padding: 60px 20px;
    text-align: center;
    background: linear-gradient(135deg, #fff1e6, #ffe0b2);
}

.festive-section h2 {
    font-size: 36px;
    color: #8B4513;
    margin-bottom: 10px;
}

.festive-section p {
    color: #6b4f3b;
    margin-bottom: 40px;
}

/* Cards Container */
.cards {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 25px;
}

/* Card */
.card {
    background: #fff;
    width: 260px;
    border-radius: 15px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    overflow: hidden;
    transition: 0.3s ease;
    position: relative;
}

.card:hover {
    transform: translateY(-10px) scale(1.03);
    box-shadow: 0 20px 40px rgba(0,0,0,0.2);
}

/* Image */
.card img {
    width: 100%;
    height: 180px;
    object-fit: cover;
}

/* Content */
.card-content {
    padding: 15px;
}

.card-content h3 {
    margin: 10px 0;
    color: #5a3825;
}

.price {
    color: #d35400;
    font-weight: 600;
    margin-bottom: 10px;
}

/* Button */
.btn {
    display: inline-block;
    padding: 10px 18px;
    background: linear-gradient(45deg, #ff7a18, #ffb347);
    color: white;
    border-radius: 25px;
    text-decoration: none;
    font-size: 14px;
    transition: 0.3s;
}

.btn:hover {
    background: linear-gradient(45deg, #e65100, #ff9800);
}

/* Festive Glow Effect */
.card::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 15px;
    padding: 2px;
    background: linear-gradient(45deg, #ffcc70, #ff7a18, #ffd700);
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    opacity: 0;
    transition: 0.3s;
}

.card:hover::before {
    opacity: 1;
}

/* Responsive */
@media (max-width: 768px) {
    .cards {
        flex-direction: column;
        align-items: center;
    }
}
</style>
</head>

<body>

<section class="festive-section">
    <h2>✨ Festive Collection ✨</h2>
    <p>Celebrate every occasion with our premium dry fruits & gift boxes</p>

    <div class="cards">

        <div class="card">
            <img src="https://images.unsplash.com/photo-1604908176997-125f25cc6f3d" alt="Almond Pack">
            <div class="card-content">
                <h3>Royal Almond Box</h3>
                <div class="price">₹899</div>
                <a href="#" class="btn">Add to Cart</a>
            </div>
        </div>

        <div class="card">
            <img src="https://images.unsplash.com/photo-1615485291234-1e0c9e27a7e3" alt="Cashew Pack">
            <div class="card-content">
                <h3>Premium Cashews</h3>
                <div class="price">₹1099</div>
                <a href="#" class="btn">Add to Cart</a>
            </div>
        </div>

        <div class="card">
            <img src="https://images.unsplash.com/photo-1590080875515-8a3a8dc5735e" alt="Mixed Dry Fruits">
            <div class="card-content">
                <h3>Festive Mix Box</h3>
                <div class="price">₹1299</div>
                <a href="#" class="btn">Add to Cart</a>
            </div>
        </div>

        <div class="card">
            <img src="https://images.unsplash.com/photo-1625944525903-9c9b9d9a5f9b" alt="Dates Pack">
            <div class="card-content">
                <h3>Arabian Dates Pack</h3>
                <div class="price">₹999</div>
                <a href="#" class="btn">Add to Cart</a>
            </div>
        </div>

    </div>
</section>

</body>
</html>
